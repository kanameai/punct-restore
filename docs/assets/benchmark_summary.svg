<svg xmlns="http://www.w3.org/2000/svg" width="960" height="404" viewBox="0 0 960 404" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans CJK JP','Noto Sans JP','Microsoft YaHei','Malgun Gothic',sans-serif" role="img"><title>Average punctuation F1 on Wikipedia</title><rect width="960" height="404" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="38" font-size="20" font-weight="700" fill="#111827">Punctuation F1 on text the model never saw in training</text><text x="24" y="62" font-size="13" fill="#6b7280">micro-F1 over , . ? ! : (higher is better) · Wikipedia paragraphs, lower-cased, punctuation removed · first 300 paragraphs per language</text><text x="24" y="96" font-size="15" font-weight="700" fill="#111827">Wikipedia, 5 languages (de en fr it nl)</text><text x="290" y="126" font-size="13" text-anchor="end" fill="#111827">punct-restore base (308M)</text><rect x="300" y="112" width="560" height="20" rx="3" fill="#f3f4f6"/><rect x="300" y="112" width="444.1" height="20" rx="3" fill="#2563eb"/><text x="752.1" y="127" font-size="13" font-weight="700" fill="#111827">0.793</text><text x="290" y="154" font-size="13" text-anchor="end" fill="#111827">punct-restore small (141M)</text><rect x="300" y="140" width="560" height="20" rx="3" fill="#f3f4f6"/><rect x="300" y="140" width="423.1" height="20" rx="3" fill="#93c5fd"/><text x="731.1" y="155" font-size="13" font-weight="700" fill="#111827">0.756</text><text x="290" y="182" font-size="13" text-anchor="end" fill="#111827">oliverguhr multilang-large (559M)</text><rect x="300" y="168" width="560" height="20" rx="3" fill="#f3f4f6"/><rect x="300" y="168" width="433.2" height="20" rx="3" fill="#f59e0b"/><text x="741.2" y="183" font-size="13" font-weight="700" fill="#111827">0.774</text><text x="290" y="210" font-size="13" text-anchor="end" fill="#111827">punctuators pcs_47lang</text><rect x="300" y="196" width="560" height="20" rx="3" fill="#f3f4f6"/><rect x="300" y="196" width="323.3" height="20" rx="3" fill="#9ca3af"/><text x="631.3" y="211" font-size="13" font-weight="700" fill="#111827">0.577</text><text x="24" y="244" font-size="15" font-weight="700" fill="#111827">Wikipedia, all 11 languages</text><text x="290" y="274" font-size="13" text-anchor="end" fill="#111827">punct-restore base (308M)</text><rect x="300" y="260" width="560" height="20" rx="3" fill="#f3f4f6"/><rect x="300" y="260" width="435.7" height="20" rx="3" fill="#2563eb"/><text x="743.7" y="275" font-size="13" font-weight="700" fill="#111827">0.778</text><text x="290" y="302" font-size="13" text-anchor="end" fill="#111827">punct-restore small (141M)</text><rect x="300" y="288" width="560" height="20" rx="3" fill="#f3f4f6"/><rect x="300" y="288" width="415.8" height="20" rx="3" fill="#93c5fd"/><text x="723.8" y="303" font-size="13" font-weight="700" fill="#111827">0.742</text><text x="290" y="330" font-size="13" text-anchor="end" fill="#111827">punctuators pcs_47lang</text><rect x="300" y="316" width="560" height="20" rx="3" fill="#f3f4f6"/><rect x="300" y="316" width="311.5" height="20" rx="3" fill="#9ca3af"/><text x="619.5" y="331" font-size="13" font-weight="700" fill="#111827">0.556</text><text x="24" y="364" font-size="12" fill="#6b7280">oliverguhr supports only these 5 languages and was given cased input (an advantage for it).</text><text x="24" y="382" font-size="12" fill="#6b7280">The test sets follow our own punctuation conventions. See "How to read the numbers" in the README.</text></svg>