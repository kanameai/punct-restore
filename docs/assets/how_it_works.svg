<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans CJK JP','Noto Sans JP','Microsoft YaHei','Malgun Gothic',sans-serif" role="img"><title>How it works</title><rect width="960" height="200" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="36" font-size="18" font-weight="700" fill="#111827">How it works</text><rect x="24" y="64" width="200" height="84" rx="10" fill="#f3f4f6" stroke="#e5e7eb"/><text x="124.0" y="100" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">speech recognizer</text><text x="124.0" y="124" font-size="11.5" text-anchor="middle" fill="#6b7280">text without punctuation</text><path d="M230 106 h22 m-7 -6 l7 6 l-7 6" stroke="#6b7280" stroke-width="2" fill="none"/><rect x="260" y="64" width="200" height="84" rx="10" fill="#dbeafe" stroke="#e5e7eb"/><text x="360.0" y="100" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">token classifier</text><text x="360.0" y="124" font-size="11.5" text-anchor="middle" fill="#6b7280">mmBERT, 1 label per token</text><path d="M466 106 h22 m-7 -6 l7 6 l-7 6" stroke="#6b7280" stroke-width="2" fill="none"/><rect x="496" y="64" width="200" height="84" rx="10" fill="#dbeafe" stroke="#e5e7eb"/><text x="596.0" y="100" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">12 labels</text><text x="596.0" y="124" font-size="11.5" text-anchor="middle" fill="#6b7280">{none , . ? ! :} × {lower, Upper}</text><path d="M702 106 h22 m-7 -6 l7 6 l-7 6" stroke="#6b7280" stroke-width="2" fill="none"/><rect x="732" y="64" width="200" height="84" rx="10" fill="#f3f4f6" stroke="#e5e7eb"/><text x="832.0" y="100" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">restore()</text><text x="832.0" y="124" font-size="11.5" text-anchor="middle" fill="#6b7280">renders 、。？！ / ，。 / ASCII</text><text x="24" y="182" font-size="12" fill="#6b7280">Inputs longer than ~250 tokens are split into windows. Labels come from real punctuated text (no model-generated labels).</text></svg>