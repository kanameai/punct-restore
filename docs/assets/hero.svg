<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans CJK JP','Noto Sans JP','Microsoft YaHei','Malgun Gothic',sans-serif" role="img"><title>Before and after examples</title><rect width="960" height="600" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="40" font-size="22" font-weight="800" fill="#111827">ASR output in, readable text out</text><text x="24" y="66" font-size="13" fill="#6b7280">real outputs of punct-restore-multilingual-base · <tspan fill="#dc2626" font-weight="700">red</tspan> = punctuation added · <tspan fill="#2563eb" font-weight="700">blue</tspan> = capital letter restored</text><rect x="20" y="92" width="920" height="68" rx="8" fill="#f9fafb"/><rect x="32" y="104" width="40" height="22" rx="11" fill="#111827"/><text x="52" y="120" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">JA</text><text x="88" y="120" font-size="14" fill="#6b7280">今日は朝から雨が降っていましたが午後には止んだので近所の公園まで散歩に出かけました</text><text x="70" y="146" font-size="15" fill="#6b7280">→</text><text x="88" y="146" font-size="16" fill="#111827">今日は朝から雨が降っていましたが<tspan fill="#dc2626" font-weight="800">、</tspan>午後には止んだので<tspan fill="#dc2626" font-weight="800">、</tspan>近所の公園まで散歩に出かけました<tspan fill="#dc2626" font-weight="800">。</tspan></text><rect x="20" y="170" width="920" height="68" rx="8" fill="#f9fafb"/><rect x="32" y="182" width="40" height="22" rx="11" fill="#111827"/><text x="52" y="198" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">JA</text><text x="88" y="198" font-size="14" fill="#6b7280">すみません駅まではどう行けばいいですか</text><text x="70" y="224" font-size="15" fill="#6b7280">→</text><text x="88" y="224" font-size="16" fill="#111827">すみません<tspan fill="#dc2626" font-weight="800">、</tspan>駅まではどう行けばいいですか<tspan fill="#dc2626" font-weight="800">？</tspan></text><rect x="20" y="248" width="920" height="68" rx="8" fill="#f9fafb"/><rect x="32" y="260" width="40" height="22" rx="11" fill="#111827"/><text x="52" y="276" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">EN</text><text x="88" y="276" font-size="14" fill="#6b7280">what time does the train to berlin leave and do i need to change in hannover</text><text x="70" y="302" font-size="15" fill="#6b7280">→</text><text x="88" y="302" font-size="16" fill="#111827"><tspan fill="#2563eb" font-weight="700">W</tspan>hat time does the train to <tspan fill="#2563eb" font-weight="700">B</tspan>erlin leave and do <tspan fill="#2563eb" font-weight="700">I</tspan> need to change in <tspan fill="#2563eb" font-weight="700">H</tspan>annover<tspan fill="#dc2626" font-weight="800">?</tspan></text><rect x="20" y="326" width="920" height="68" rx="8" fill="#f9fafb"/><rect x="32" y="338" width="40" height="22" rx="11" fill="#111827"/><text x="52" y="354" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">FR</text><text x="88" y="354" font-size="14" fill="#6b7280">je ne sais pas si je peux venir demain mais je te préviens dès que possible</text><text x="70" y="380" font-size="15" fill="#6b7280">→</text><text x="88" y="380" font-size="16" fill="#111827"><tspan fill="#2563eb" font-weight="700">J</tspan>e ne sais pas si je peux venir demain<tspan fill="#dc2626" font-weight="800">,</tspan> mais je te préviens dès que possible<tspan fill="#dc2626" font-weight="800">.</tspan></text><rect x="20" y="404" width="920" height="68" rx="8" fill="#f9fafb"/><rect x="32" y="416" width="40" height="22" rx="11" fill="#111827"/><text x="52" y="432" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">ZH</text><text x="88" y="432" font-size="14" fill="#6b7280">我昨天去了超市买了一些水果和蔬菜然后回家做饭</text><text x="70" y="458" font-size="15" fill="#6b7280">→</text><text x="88" y="458" font-size="16" fill="#111827">我昨天去了超市买了一些水果和蔬菜<tspan fill="#dc2626" font-weight="800">，</tspan>然后回家做饭<tspan fill="#dc2626" font-weight="800">。</tspan></text><rect x="20" y="482" width="920" height="68" rx="8" fill="#f9fafb"/><rect x="32" y="494" width="40" height="22" rx="11" fill="#111827"/><text x="52" y="510" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">KO</text><text x="88" y="510" font-size="14" fill="#6b7280">오늘은 날씨가 좋아서 친구들과 함께 공원에 갔어요 정말 즐거웠어요</text><text x="70" y="536" font-size="15" fill="#6b7280">→</text><text x="88" y="536" font-size="16" fill="#111827">오늘은 날씨가 좋아서 친구들과 함께 공원에 갔어요<tspan fill="#dc2626" font-weight="800">.</tspan> 정말 즐거웠어요<tspan fill="#dc2626" font-weight="800">.</tspan></text><text x="24" y="584" font-size="12" fill="#6b7280">11 languages · one model · CPU: 10 short sentences in ~0.3 s</text></svg>